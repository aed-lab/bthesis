# .github/workflows/build.yml
name: Build thesis

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: paperist/texlive-ja:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build PDF
        run: latexmk main.tex

      - name: Upload PDF
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: thesis-pdf
          path: out/main.pdf
          retention-days: 14